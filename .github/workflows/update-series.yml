name: Update Thai series catalogue

on:
  schedule:
    # Daily at 18:00 UTC (about 5:00 am Melbourne during daylight saving).
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-thai-series
  cancel-in-progress: false

jobs:
  import-series:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import catalogue from TMDB
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          START_DATE: "2024-01-01"
        run: python scripts/import_series.py

      - name: Commit updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json
          if git diff --cached --quiet; then
            echo "Catalogue has no changes."
          else
            git commit -m "Update Thai series catalogue"
            git push
          fi
